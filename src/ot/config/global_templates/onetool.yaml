# OneTool Configuration
version: 2

# Paths are relative to this file's directory (the .onetool/ directory)
include:
  - snippets.yaml   # Snippet workflows
  - servers.yaml    # External MCP servers
  - security.yaml   # Security allowlists (builtins, imports, calls)
  - arch.yaml       # Arch tool settings and templates
  - diagram.yaml    # Diagram tool settings and templates

# Glob patterns for custom tool discovery (relative to .onetool/, or absolute)
# Example: ["tools/*.py"] loads all Python files in .onetool/tools/
tools_dir: []

# Generation and embeddings are opt-in, independent routes. See the LLM routing
# guide. The optional code-routing.yaml template adds exact proxy routes and direct
# Codex profiles for code-harness launching.

# log_level: INFO

# MCP-owned direct API (optional)
direct:
  host:
    enabled: false  # true binds an authenticated loopback API from the MCP process
    port: 8765      # preferred API port; MCP startup probes upward to 65535
