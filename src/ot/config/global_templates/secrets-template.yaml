# OneTool Secrets Configuration
# Store API keys and tokens here. This file should be gitignored.
# Encrypt values with: __onetool ot_secrets.encrypt(file=<this file>)
#
# Values can reference environment variables: ${VAR_NAME}
# This file is loaded relative to onetool.yaml.

# ============================================================================
# API KEYS FOR BUILT-IN TOOLS
# ============================================================================
# Uncomment and add your API keys:

# Brave Search API
# Get your key at: https://brave.com/search/api/
# BRAVE_API_KEY: "your-brave-api-key"

# OpenAI API (for explicit direct generation or embedding routes)
# Get your key at: https://platform.openai.com/api-keys
# OPENAI_API_KEY: "sk-..."

# OpenRouter API (for an explicit direct generation route)
# Get your key at: https://openrouter.ai/keys
# OPENROUTER_API_KEY: "sk-or-..."

# CLIProxyAPI inference-client key (for an explicit cliproxy generation route)
# CLIPROXY_INFERENCE_KEY: "your-inference-client-key"

# Google Gemini API (for grounding search)
# Get your key at: https://aistudio.google.com/apikey
# GEMINI_API_KEY: "AIza..."

# Context7 API (for library documentation)
# Get your key at: https://context7.com/
# CONTEXT7_API_KEY: "ctx7sk-..."

# Anthropic API
# Get your key at: https://console.anthropic.com/
# ANTHROPIC_API_KEY: "sk-ant-..."
