# OneTool Shared Server Definitions
# Load via: include: [config/servers.yaml]
#
# These are common MCP server configurations that can be included
# in project-specific onetool.yaml files.
#
# Full setup guides: https://onetool.beycom.online/reference/servers/

servers:

  # =============================================================================
  # CHROME DEVTOOLS MCP
  # =============================================================================
  # Browser automation and debugging via Chrome DevTools Protocol.
  chrome_devtools:
    type: stdio
    command: npx
    args:
      - "-y"
      - "chrome-devtools-mcp@latest"
      - "--isolated"            # Temporary profile, auto-cleaned
      - "--viewport=1280x720"   # Consistent window size
      - "--no-usage-statistics" # Disable data collection
    timeout: 120
    enabled: false
    description: Browser automation and debugging via Chrome DevTools Protocol
    source: https://github.com/ChromeDevTools/chrome-devtools-mcp
    instructions: |
      Workflow: navigate_page → take_screenshot → interact (click/fill) → take_screenshot
      Use wait_for before interacting with elements to ensure page load.
      evaluate_script requires function= param (a JS function string), not expression=.

  # =============================================================================
  # MULTI-INSTANCE EXAMPLE
  # =============================================================================
  # You can run multiple named instances of the same server binary.
  # Useful for having one browser session per task, or mixing connection modes.
  #
  # chrome_devtools_isolated:
  #   type: stdio
  #   command: npx
  #   args: ["-y", "chrome-devtools-mcp@latest", "--isolated", "--viewport=1280x720"]
  #   timeout: 120
  #   enabled: false  # Enable with: ot_servers.enable(name="chrome_devtools_isolated")
  #
  # chrome_devtools_auto:
  #   type: stdio
  #   command: npx
  #   args: ["-y", "chrome-devtools-mcp@latest", "--autoConnect", "--channel=beta"]
  #   timeout: 120
  #   enabled: false  # Enable with: ot_servers.enable(name="chrome_devtools_auto")


  # =============================================================================
  # PLAYWRIGHT MCP
  # =============================================================================
  # Browser automation via Playwright accessibility tree (no vision needed).
  playwright:
    type: stdio
    command: npx
    args:
      - "@playwright/mcp@latest"
    timeout: 120
    enabled: false
    description: Browser automation via accessibility tree (no vision needed)
    source: https://github.com/microsoft/playwright-mcp
    instructions: |
      Workflow: browser_navigate → browser_snapshot → interact → browser_snapshot
      Prefer browser_snapshot over browser_screenshot (faster, no vision needed).
      Use browser_evaluate for custom JavaScript execution.

  # =============================================================================
  # GITHUB MCP (HTTP)
  # =============================================================================
  # GitHub's official MCP server for repos, issues, PRs, Actions, and more.
  #
  # SETUP:
  #   Add GITHUB_TOKEN to ~/.onetool/secrets.yaml before enabling.
  #
  github:
    type: http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
      Accept: "application/json, text/event-stream"
    timeout: 120
    enabled: false
    description: Official GitHub API — repos, issues, PRs, Actions
    source: https://github.com/github/github-mcp-server
    instructions: |
      Requires GITHUB_TOKEN in secrets.yaml. Always specify owner and repo.
      Use list/search tools before individual gets. Search before creating issues or PRs.
      PR workflow: branch → push_files → create_pull_request.


  # =============================================================================
  # AZURE MCP SERVER (Official — microsoft/mcp)
  # =============================================================================
  # 276 tools across 57 Azure services: compute, storage, AKS, Cosmos DB,
  # Monitor/KQL, App Service, Container Apps, AI Foundry, App Config, and more.
  #
  # Docs:   https://learn.microsoft.com/azure/developer/azure-mcp-server/overview
  # Source: https://github.com/microsoft/mcp/tree/main/servers/Azure.Mcp.Server
  # Tools:  https://learn.microsoft.com/azure/developer/azure-mcp-server/tools/
  #
  # SETUP — pick one auth method:
  #
  #   Local dev (recommended):
  #     az login                         # Azure CLI — picked up automatically
  #
  #   Service principal (CI/CD):
  #     Add to ~/.onetool/secrets.yaml:
  #       AZURE_CLIENT_ID: "<app-id>"
  #       AZURE_CLIENT_SECRET: "<secret>"
  #       AZURE_TENANT_ID: "<tenant-id>"
  #
  #   Subscription scoping (optional):
  #     Add to ~/.onetool/secrets.yaml:
  #       AZURE_SUBSCRIPTION_ID: "<subscription-id>"
  #
  # FILTERING (add to args if needed):
  #   - "--namespace"
  #   - "storage"                        # only expose storage tools
  #   - "--namespace"
  #   - "keyvault"                       # stack --namespace flags to add more
  #   - "--mode"
  #   - "all"                            # expose all 276 tools individually (default: namespace)
  #   - "--read-only"                    # read-only operations only
  #   - "--cloud"
  #   - "AzureUSGovernment"              # sovereign cloud support
  #
  azure:
    type: stdio
    command: uvx
    args:
      - "--from"
      - "msmcp-azure"
      - "azmcp"
      - "server"
      - "start"
    inherit_env: true
    env:
      AZURE_MCP_COLLECT_TELEMETRY_MICROSOFT: "false"
    timeout: 120
    enabled: false
    description: "Azure MCP Server — 276 tools across 57 Azure services (compute, storage, AKS, Cosmos DB, Monitor, AI Foundry)"
    source: https://github.com/microsoft/mcp
    instructions: |
      Auth: run `az login` locally, or set AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID for service principal.
      Set AZURE_SUBSCRIPTION_ID to scope to a default subscription.
      Tools are namespaced by Azure service (e.g. storage, compute, keyvault).
      To filter services: add --namespace <service> to args. To expose all ops individually: add --mode all.
      Docs: https://learn.microsoft.com/azure/developer/azure-mcp-server/


  # =============================================================================
  # CHUNKHOUND MCP
  # =============================================================================
  # Regex and semantic code search for large codebases.
  #
  # SETUP:
  #   pip install chunkhound && chunkhound index   (run from project root)
  #
  chunkhound:
    type: stdio
    command: chunkhound
    args:
      - "mcp"
    timeout: 300
    inherit_env: true  # Required: passes CHUNKHOUND_EMBEDDING__API_KEY set during indexing
    enabled: false
    description: Regex and semantic code search for large codebases
    source: https://github.com/chunkhound/chunkhound
    instructions: |
      Must index before use: pip install chunkhound && chunkhound index (run from project root).

