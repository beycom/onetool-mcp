# Exact Claude Code and Codex launcher configuration.
#
# CLIProxyAPI is independently managed. Direct Codex profiles use Codex's own
# profile configuration and credentials.
code:
  default:
    model: gpt-5.6-sol
    route: codex_subscription

  proxy:
    routes:
      codex_subscription:
        - id: gpt-5.6-sol
          shortcut: sol

      openrouter:
        - id: z-ai/glm-5.2
          shortcut: glm
          claude:
            context: 1m
            auto_compact_window: 900000

  direct:
    codex:
      profiles:
        openrouter:
          - id: z-ai/glm-5.2
            shortcut: direct-glm
