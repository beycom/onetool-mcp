<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ system.name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.9/styles/ag-grid.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.9/styles/ag-theme-alpine.min.css" rel="stylesheet">
    <!-- Tailwind Play CDN: dev-oriented (compiles styles in the browser); the
         report requires network access to render with full styling. -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>{{ styles|safe }}</style>
</head>
<body class="bg-base-100">
    <main class="container mx-auto px-4 py-6 max-w-7xl">
        {% if not is_index %}
        <div class="mb-4">
            <a href="index.html" class="link link-hover text-sm">&larr; Solution Index</a>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.9/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
    <script>{{ scripts|safe }}</script>
</body>
</html>
