[project]
name = "onetool-mcp"
version = "4.0.0rc1"
description = "A small MCP gateway with YAML configuration and Python orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{name = "Gavin Las", email = "beycom99@gmail.com"}]
dependencies = [
    "fastmcp[code-mode]>=4.2.1,<4.3",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.3,<7",
    "py-key-value-aio[keyring]>=0.5.0,<0.6",
    "keyring>=25.7.0,<26",
]

[project.scripts]
onetool = "onetool.cli:main"

[project.urls]
Repository = "https://github.com/beycom/onetool-mcp"
Issues = "https://github.com/beycom/onetool-mcp/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onetool"]

[tool.hatch.build.targets.sdist]
include = ["src/onetool", "tests", "pyproject.toml", "uv.lock", "README.md", "LICENSE.txt", "justfile", "AGENTS.md", ".wtp.yml"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "ruff>=0.17.5,<0.18",
    "mypy>=2.4.1,<3",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]
