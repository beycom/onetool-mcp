version: "1.0"

defaults:
  # Keep this repository's worktrees together without colliding with sibling
  # projects that also use wtp.
  base_dir: "../onetool-mcp-worktrees"

hooks:
  post_create:
    # Every worktree sees the one private planning checkout linked into the
    # main worktree.
    - type: symlink
      from: "planning"
      to: "planning"

    # .codex in the main worktree is the master agent configuration. Its
    # skills directory links to planning/skills. Each worktree links to it and
    # gets a relative .claude -> .codex like the main checkout.
    - type: symlink
      from: ".codex"
      to: ".codex"

    - type: command
      command: "ln -sfn .codex .claude"

    - type: symlink
      from: ".mcp.json"
      to: ".mcp.json"
