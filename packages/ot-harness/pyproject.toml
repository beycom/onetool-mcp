[project]
name = "ot-harness"
version = "0.1.0"
description = "Harbor-backed Codex benchmark harness for OneTool"
requires-python = ">=3.12"
dependencies = [
    "onetool-mcp",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.25.0",
]

[project.scripts]
ot-harness = "ot_harness.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ot_harness"]

[tool.uv.sources]
onetool-mcp = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF"]
ignore = ["E501", "B008", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["ot_harness", "ot", "ottools", "onetool", "otdev", "otutil"]

[tool.ruff.lint.per-file-ignores]
"src/ot_harness/cli.py" = ["TC001", "TCH003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src/ot_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "smoke: <1s each",
    "unit: <1s each, no I/O",
    "bench: benchmark harness tests",
    "pkg: package tests",
]
