name: fix-git-base-onetool-canary
harbor:
  dataset: terminal-bench/terminal-bench-2-1
  agent: codex
  model: gpt-5.2
  run_args:
    - --yes
variants:
  - id: codex-base
    path: ../../../packages/ot-harness/variants/codex-base.yaml
  - id: codex-onetool-mcp
    path: ../../../packages/ot-harness/variants/codex-onetool-mcp.yaml
task_file: fix-git-tasks.yaml
repetitions: 1
timeout_seconds: 1800
output_root: ../harbor
metrics:
  verifier_required: true
  tokens_required: false
  cost_required: false
