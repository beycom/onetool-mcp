schema_version: 3
milestones:
- id: acme-2027-edge-foundation
  name: Edge Foundation
  tags:
  - year
  - ecom
  - code
- id: acme-2028-catalog-search
  name: Catalog and Search
  tags:
  - year
  - ecom
- id: acme-2029-customer-cart-pricing
  name: Customer, Cart and Pricing
  tags:
  - year
  - ecom
- id: acme-2030-transaction-core
  name: Transaction Core
  tags:
  - year
  - ecom
  - code
- id: acme-2031-complete-cutover
  name: Complete Cutover
  tags:
  - year
  - ecom
  - migrate
timelines:
- id: program
  milestones:
  - acme-2027-edge-foundation
  - acme-2028-catalog-search
  - acme-2029-customer-cart-pricing
  - acme-2030-transaction-core
  - acme-2031-complete-cutover
systems:
- id: legacy-commerce
  name: Legacy Commerce Platform
  end_in: acme-2030-transaction-core
  description: Customer storefront, back-office administration, and all commerce domains in
    one deployable estate.
  tags:
  - legacy
  - ecommerce
  - strangler-source
  properties:
    availability_target: 99.9%
    criticality: tier-1
    lifecycle: migrate
- id: enterprise-fulfilment
  name: Enterprise Fulfilment
  description: Existing ERP and warehouse management capabilities.
  tags:
  - enterprise
  - fulfilment
  properties:
    criticality: tier-1
    lifecycle: retain
- id: enterprise-order-management
  name: Enterprise Order Management
  description: Internal enterprise OMS coordinating downstream fulfilment, exceptions, and
    cross-channel order visibility.
  tags:
  - internal
  - orders
  - system-of-record
  properties:
    criticality: tier-1
    group: sor
    lifecycle: retain
    ownership_boundary: enterprise-fulfilment-order
- id: enterprise-finance
  name: Enterprise Finance
  description: Internal finance ledger, settlement, reconciliation, and revenue accounting
    platform.
  tags:
  - internal
  - finance
  - system-of-record
  properties:
    criticality: tier-1
    group: sor
    lifecycle: retain
- id: payment-provider
  name: Payment Service Provider
  description: External payment authorization, capture, refund, and token vault services.
  tags:
  - external
  - payments
  - pci
  properties:
    data_classification: pci
    lifecycle: retain
- id: customer-engagement
  name: Customer Engagement Provider
  description: External email and SMS delivery platform.
  tags:
  - external
  - communications
  properties:
    lifecycle: retain
- id: enterprise-identity
  name: Enterprise Identity
  description: Customer and workforce authentication provider.
  tags:
  - enterprise
  - identity
  properties:
    criticality: tier-1
    lifecycle: retain
- id: analytics-provider
  name: Digital Analytics Provider
  description: External SaaS for consented web and product analytics.
  tags:
  - external
  - analytics
  - saas
  properties:
    data_classification: pseudonymous
    lifecycle: retain
- id: tax-provider
  name: Tax Calculation Provider
  description: External tax jurisdiction, calculation, and audit API.
  tags:
  - external
  - tax
  - saas
  properties:
    criticality: tier-1
    lifecycle: retain
- id: fraud-provider
  name: Fraud Decision Provider
  description: External real-time payment and account fraud scoring service.
  tags:
  - external
  - fraud
  - saas
  properties:
    criticality: tier-1
    lifecycle: retain
- id: commerce-platform
  name: Digital Commerce Platform
  start_in: acme-2027-edge-foundation
  description: Target cloud-native commerce platform introduced alongside the legacy system.
  tags:
  - target
  - ecommerce
  - microservices
  properties:
    availability_target: 99.95%
    criticality: tier-1
    lifecycle: strategic
subsystems:
- id: storefront-edge
  name: Storefront and Edge
  parent: commerce-platform
  start_in: acme-2027-edge-foundation
  description: Customer-facing entry points routing storefront traffic
    into the new platform.
  tags:
  - ecommerce
  - frontend
- id: platform-foundation
  name: Platform Foundation
  parent: commerce-platform
  start_in: acme-2027-edge-foundation
  description: Cross-cutting eventing, observability, and legacy
    integration capability underpinning every other subsystem.
  tags:
  - platform
  - integration
- id: catalog-search
  name: Catalog and Search
  parent: commerce-platform
  start_in: acme-2028-catalog-search
  description: Product catalog mastering, merchandising, and search
    capability.
  tags:
  - bounded-context-catalog
- id: customer-cart-pricing
  name: Customer, Cart and Pricing
  parent: commerce-platform
  start_in: acme-2029-customer-cart-pricing
  description: Customer-identity-linked shopping capability - profiles,
    carts, prices, and notifications.
  tags:
  - bounded-context-customer
- id: transaction-core
  name: Transaction Core
  parent: commerce-platform
  start_in: acme-2030-transaction-core
  description: Order capture and fulfilment initiation - checkout,
    orders, payments, and inventory.
  tags:
  - bounded-context-order
- id: back-office-insight
  name: Back Office and Insight
  parent: commerce-platform
  start_in: acme-2031-complete-cutover
  description: Administration and operational reporting over the
    completed platform.
  tags:
  - admin
  - analytics
containers:
- id: commerce-monolith
  name: Commerce Monolith
  parent: legacy-commerce
  description: Single Java deployment containing storefront, administration, catalog, cart,
    checkout, customer, and order logic.
  tags:
  - legacy
  - monolith
  - stateful
  properties:
    criticality: tier-1
    deployment: virtual-machines
    owner: Commerce Core Team
    release_cadence: monthly
    technology: Java / Spring MVC
- id: commerce-monolith
  name: Commerce Monolith
  parent: legacy-commerce
  start_in: acme-2027-edge-foundation
  description: Legacy commerce deployment reachable only behind strangler-controlled routes
    and adapters.
  tags:
  - legacy
  - monolith
  - stateful
  properties:
    criticality: tier-1
    deployment: virtual-machines
    owner: Commerce Core Team
    release_cadence: monthly
    technology: Java / Spring MVC
- id: erp-wms
  name: ERP and WMS
  parent: enterprise-fulfilment
  description: Inventory master, warehouse execution, and fulfilment planning.
  tags:
  - system-of-record
  - fulfilment
  properties:
    owner: Supply Chain Technology
    technology: Commercial ERP
- id: enterprise-oms
  name: Enterprise OMS
  parent: enterprise-order-management
  description: Enterprise order routing, exception handling, and downstream fulfilment coordination.
  tags:
  - internal
  - orders
  - system-of-record
  properties:
    owner: Order Operations Technology
    technology: Commercial OMS
- id: finance-ledger
  name: Finance Ledger and Reconciliation
  parent: enterprise-finance
  description: Enterprise settlement, reconciliation, and accounting integration.
  tags:
  - internal
  - finance
  - system-of-record
  properties:
    owner: Finance Technology
    technology: Finance ERP
- id: payment-gateway
  name: Payment Gateway API
  parent: payment-provider
  description: Tokenized payment API hosted by the external provider.
  tags:
  - external-api
  - pci
  properties:
    owner: Payment Provider
    technology: REST API
- id: messaging-provider
  name: Messaging Provider API
  parent: customer-engagement
  description: Email and SMS delivery API.
  tags:
  - external-api
  properties:
    owner: Engagement Provider
    technology: REST API
- id: identity-provider
  name: Identity Provider
  parent: enterprise-identity
  description: OAuth 2.0 and OpenID Connect identity service.
  tags:
  - identity
  - security
  properties:
    owner: Identity Platform Team
    technology: OIDC
- id: digital-analytics-api
  name: Digital Analytics API
  parent: analytics-provider
  description: External analytics event collection and reporting API.
  tags:
  - external-api
  - analytics
  properties:
    owner: Analytics Provider
    technology: HTTPS collection API
- id: tax-api
  name: Tax Calculation API
  parent: tax-provider
  description: External tax quote, commit, void, and audit API.
  tags:
  - external-api
  - tax
  properties:
    owner: Tax Provider
    technology: REST API
- id: fraud-api
  name: Fraud Decision API
  parent: fraud-provider
  description: External fraud score and decision API.
  tags:
  - external-api
  - fraud
  properties:
    owner: Fraud Provider
    technology: REST API
- id: commerce-edge
  name: Commerce Edge
  parent: storefront-edge
  start_in: acme-2027-edge-foundation
  description: CDN, WAF, TLS termination, and route-based strangler control plane.
  tags:
  - edge
  - security
  - strangler
  properties:
    deployment: managed-cloud
    owner: Platform Edge Team
    technology: Managed CDN / WAF / API gateway
- id: storefront-bff
  name: Storefront BFF
  parent: storefront-edge
  start_in: acme-2027-edge-foundation
  description: Channel-oriented API composition layer for the web storefront.
  tags:
  - bff
  - stateless
  properties:
    deployment: kubernetes
    owner: Storefront Team
    scaling: horizontal
    technology: TypeScript / Node.js
- id: event-backbone
  name: Commerce Event Backbone
  parent: platform-foundation
  start_in: acme-2027-edge-foundation
  description: Durable domain-event transport with schema governance and replay.
  tags:
  - eventing
  - platform
  properties:
    delivery_semantics: at-least-once
    owner: Platform Messaging Team
    technology: Managed Kafka
- id: observability-platform
  name: Commerce Observability Platform
  parent: platform-foundation
  start_in: acme-2027-edge-foundation
  description: Central metrics, logs, traces, alerting, and service-level objectives.
  tags:
  - observability
  - platform
  properties:
    owner: Site Reliability Engineering
    technology: OpenTelemetry / managed observability
- id: legacy-integration-adapter
  name: Legacy Anti-corruption Layer
  parent: platform-foundation
  start_in: acme-2027-edge-foundation
  end_in: acme-2030-transaction-core
  description: Stable adapters translating legacy concepts and contracts into target-domain
    APIs and events.
  tags:
  - anti-corruption-layer
  - temporary
  - strangler
  properties:
    lifecycle: retire-in-year-5
    owner: Migration Enablement Team
    technology: Java / integration runtime
- id: analytics-event-adapter
  name: Analytics Event Adapter
  parent: platform-foundation
  start_in: acme-2027-edge-foundation
  description: Consent-aware, schema-controlled adapter for external digital analytics.
  tags:
  - analytics
  - privacy
  - anti-corruption-layer
  properties:
    owner: Digital Analytics Team
    pii: prohibited
    technology: TypeScript / streaming runtime
- id: catalog-service
  name: Catalog Service
  parent: catalog-search
  start_in: acme-2028-catalog-search
  description: System of record for products, categories, assortment, and sellability.
  tags:
  - microservice
  - bounded-context-catalog
  properties:
    criticality: tier-1
    deployment: kubernetes
    owner: Catalog Team
    technology: Kotlin / Spring Boot
- id: search-service
  name: Search Service
  parent: catalog-search
  start_in: acme-2028-catalog-search
  description: Product search, faceting, ranking, and query suggestions from event-fed projections.
  tags:
  - microservice
  - bounded-context-search
  - cqrs-read-model
  properties:
    deployment: kubernetes
    owner: Search Team
    technology: Java / OpenSearch
- id: catalog-sync-adapter
  name: Catalog Migration Adapter
  parent: catalog-search
  start_in: acme-2028-catalog-search
  end_in: acme-2030-transaction-core
  description: Temporary idempotent translation and reconciliation between legacy merchandising
    and Catalog Service.
  tags:
  - migration-adapter
  - temporary
  properties:
    lifecycle: retire-in-year-5
    owner: Migration Enablement Team
    technology: Java / Kafka Connect
- id: customer-service
  name: Customer Service
  parent: customer-cart-pricing
  start_in: acme-2029-customer-cart-pricing
  description: Customer profile, addresses, preferences, and identity linkage.
  tags:
  - microservice
  - bounded-context-customer
  properties:
    data_classification: confidential
    owner: Customer Accounts Team
    technology: Kotlin / Spring Boot
- id: cart-service
  name: Cart Service
  parent: customer-cart-pricing
  start_in: acme-2029-customer-cart-pricing
  description: Durable shopping carts with optimistic concurrency and expiry policies.
  tags:
  - microservice
  - bounded-context-cart
  properties:
    criticality: tier-1
    owner: Cart Team
    technology: Go
- id: pricing-service
  name: Pricing Service
  parent: customer-cart-pricing
  start_in: acme-2029-customer-cart-pricing
  description: Effective prices, promotions, eligibility, and explainable calculation results.
  tags:
  - microservice
  - bounded-context-pricing
  properties:
    owner: Pricing Team
    technology: Java / Spring Boot
- id: notification-service
  name: Notification Service
  parent: customer-cart-pricing
  start_in: acme-2029-customer-cart-pricing
  description: Template, preference, deduplication, and delivery orchestration for customer
    communications.
  tags:
  - microservice
  - bounded-context-notification
  - event-driven
  properties:
    owner: Customer Communications Team
    technology: TypeScript / Node.js
- id: checkout-service
  name: Checkout Orchestrator
  parent: transaction-core
  start_in: acme-2030-transaction-core
  description: Explicit saga coordinating validation, reservation, payment, order creation,
    and compensations.
  tags:
  - microservice
  - bounded-context-checkout
  - saga-orchestrator
  properties:
    criticality: tier-1
    idempotency: required
    owner: Checkout Team
    technology: Java / workflow engine
- id: order-service
  name: Order Service
  parent: transaction-core
  start_in: acme-2030-transaction-core
  description: System of record for accepted orders and order lifecycle state.
  tags:
  - microservice
  - bounded-context-order
  properties:
    criticality: tier-1
    owner: Order Team
    technology: Kotlin / Spring Boot
- id: payment-service
  name: Payment Service
  parent: transaction-core
  start_in: acme-2030-transaction-core
  description: PCI-minimized payment intents, authorization, capture, refund, and reconciliation.
  tags:
  - microservice
  - bounded-context-payment
  - pci-scope-minimized
  properties:
    criticality: tier-1
    owner: Payments Team
    technology: Java / Spring Boot
- id: inventory-service
  name: Inventory Service
  parent: transaction-core
  start_in: acme-2030-transaction-core
  description: Commerce availability projection and time-bound stock reservations synchronized
    with ERP/WMS.
  tags:
  - microservice
  - bounded-context-inventory
  properties:
    criticality: tier-1
    owner: Inventory Team
    technology: Go
- id: admin-portal
  name: Commerce Administration Portal
  parent: back-office-insight
  start_in: acme-2031-complete-cutover
  description: Role-based customer service and merchandising experience composed over target-domain
    APIs.
  tags:
  - frontend
  - internal
  - micro-frontend-ready
  properties:
    authentication: enterprise-identity
    owner: Commerce Operations Experience Team
    technology: React / TypeScript
- id: reporting-service
  name: Commerce Reporting Service
  parent: back-office-insight
  start_in: acme-2031-complete-cutover
  description: Operational reporting over event-fed read models; never queries service databases
    directly.
  tags:
  - microservice
  - reporting
  - cqrs-read-model
  properties:
    owner: Commerce Data Products Team
    technology: Python / SQL
