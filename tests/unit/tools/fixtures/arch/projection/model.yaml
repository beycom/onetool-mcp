schema_version: 3
milestones:
  - id: m1
    name: Milestone one
  - id: m2
    name: Milestone two
  - id: m3
    name: Milestone three
timelines:
  - id: program
    milestones: [m1, m2, m3]
  - id: alt
    milestones: [m1, m3]
systems:
  - id: sysA
    name: Alpha Platform
  - id: sysB
    name: Beta Services
    start_in: m1
  - id: sysL
    name: Legacy Suite
    end_in: m1
subsystems:
  - id: ssA
    name: Alpha Services
    parent: sysA
containers:
  - id: subA
    name: Alpha Core
    parent: ssA
  - id: subB
    name: Beta API
    parent: sysB
    start_in: m1
  - id: subL
    name: Legacy Store
    parent: sysL
  - id: subG
    name: Gateway
    parent: sysA
    end_in: base
  - id: subG
    name: Gateway v2
    parent: sysA
    start_in: m2
  - id: subR
    name: Registry
    parent: ssA
    description: Legacy registry
    properties:
      owner: core
  - id: subR
    name: Registry
    parent: ssA
    start_in: m2
    description: Rewritten registry
    properties:
      owner: platform
components:
  - id: compA
    name: Alpha Worker
    container: subA
  - id: compL
    name: Legacy Records
    container: subL
code: []
users:
  - id: u1
    name: Operator
interfaces:
  - id: iAL
    name: Read legacy records
    provider: subL
    consumer: subA
  - id: iAA
    name: Register worker
    provider: compA
    consumer: subR
  - id: iUB
    name: Operate beta
    provider: subB
    consumer: u1
    start_in: m1
    call_direction: consumer_to_provider
  - id: iAB
    name: Sync alpha to beta
    provider: subA
    consumer: subB
    start_in: m2
    data_flow_direction: provider_to_consumer
relationships:
  - id: r1
    action: governs
    source: sysA
    target: sysB
    start_in: m1
