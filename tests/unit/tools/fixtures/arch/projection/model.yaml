schema_version: 3
milestones:
  - id: m1
    name: Milestone one
  - id: m2
    name: Milestone two
  - id: m3
    name: Milestone three
timelines:
  - id: program
    milestones: [m1, m2, m3]
  - id: alt
    milestones: [m1, m3]
systems:
  - id: sysA
    name: Alpha Platform
  - id: sysB
    name: Beta Services
    from: m1
  - id: sysL
    name: Legacy Suite
    until: m2
subsystems:
  - id: subA
    name: Alpha Core
    system: sysA
  - id: subB
    name: Beta API
    system: sysB
    from: m1
  - id: subL
    name: Legacy Store
    system: sysL
  - id: subG
    name: Gateway
    system: sysA
    until: m1
  - id: subG
    name: Gateway v2
    system: sysA
    from: m2
  - id: subR
    name: Registry
    system: sysA
    description: Legacy registry
    properties:
      owner: core
  - id: subR
    name: Registry
    system: sysA
    from: m2
    description: Rewritten registry
    properties:
      owner: platform
components:
  - id: compA
    name: Alpha Worker
    subsystem: subA
  - id: compL
    name: Legacy Records
    subsystem: subL
users:
  - id: u1
    name: Operator
interfaces:
  - id: iAL
    name: Read legacy records
    provider: subL
    consumer: subA
  - id: iAA
    name: Register worker
    provider: compA
    consumer: subR
  - id: iUB
    name: Operate beta
    provider: subB
    consumer: u1
    from: m1
    call_direction: consumer_to_provider
  - id: iAB
    name: Sync alpha to beta
    provider: subA
    consumer: subB
    from: m2
    data_flow: provider_to_consumer
relationships:
  - id: r1
    action: governs
    source: sysA
    target: sysB
    from: m1
